        <p>The <strong>Round Rock Sasquatch Society</strong> is an unincorporated association of researchers, hobbyists, and at least one retired Williamson County park ranger, dedicated to the systematic documentation of Sasquatch activity along the Brushy Creek watershed and the surrounding cedar breaks of Central Texas.</p>
        <p>We were founded in Bill's garage in 2014, more or less, with funds raised by selling a folding table at a yard sale. We have grown modestly since. We have a P.O. box now.</p>
        <div class="article-section-divider"><img src="-/media/99B8D9AD-CBA0-4031-B26B-5F311EFF7D54.ashx" alt="" /></div>
        <h2>Our Mission</h2>
        <p>To document — calmly, persistently, and with appropriate humility — the activity of a large, bipedal, hair-covered creature that has been reported in Williamson County since before the area was Williamson County. We do not seek to capture, harm, or significantly inconvenience the subject. We seek to know it is there.</p>
        <p>We are not a wildlife agency. We are not affiliated with the Williamson County Parks Department, despite repeated suggestions in community Facebook groups that we should be. We are also not a cult. This question has come up enough times that we feel obligated to address it directly.</p>
        <h2>The Founders</h2>
        <p>The Society was founded by a small group of long-time Round Rock residents who, for personal and professional reasons, prefer to remain anonymous. Several of them work at Dell. One of them absolutely does not work at Dell and has clarified this several times. Bill, the retired park ranger, has agreed to be named because, in his words, "what are they gonna do, fire me again."</p>
        <h2>What We Do</h2>
        <ul>
        <li><strong>Field research</strong> — trail cameras, audio recording, plaster casting, the occasional thermal sweep when Doug remembers to charge the batteries</li>
        <li><strong>Eyewitness documentation</strong> — interviews with long-time residents, careful transcription, light fact-checking</li>
        <li><strong>Public education</strong> — this website, the (annual, sometimes printed) newsletter, and the occasional appearance on a podcast nobody we know listens to</li>
        <li><strong>Trail stewardship</strong> — picking up trash on the Brushy Creek trail, which we feel obligated to do given how much time we spend there at suspicious hours</li>
        </ul>
        <h2>Membership</h2>
        <p>The Society offers Lifetime Membership at a one-time fee. Members receive a numbered card, voting rights at the (irregularly held) Annual General Meeting, and the spiritual satisfaction of having funded several rounds of trail camera batteries. Visit the <a href="/shop/society-membership">membership page</a> for details.</p>
        <h2>Contact</h2>
        <p>We are reachable, in descending order of reliability:</p>
        <ul>
        <li><strong>By mail</strong> — P.O. Box 4042, Round Rock, TX 78680. We check it monthly when somebody is going past the post office anyway.</li>
        <li><strong>By email</strong> — bigfoot@roundrocksasquatch.example (this is a fake site for satirical purposes, please do not email)</li>
        <li><strong>In person</strong> — most second Tuesdays, in the back corner booth of a Whataburger we will not name publicly because they have asked us not to</li>
        </ul>
        <h2>A Final Note</h2>
        <p>Everything on this site is offered in the spirit of curiosity, humor, and a deep affection for the cedar breaks of Williamson County. We do not claim to have proof. We claim, modestly, to have been paying attention. The creek has been here a long time. We think something else has too.</p>
