        Before Round Rock became synonymous with Dell Technologies, youth baseball tournaments, and the eternal Kalahari Resorts traffic backup, it had a different kind of reputation among old-timers. The creek bottoms, cedar breaks, and limestone bluffs of Williamson County have hosted reports of a large, bipedal, hair-covered creature for as long as anyone around here can remember.
        
        We spent several weeks talking to long-time residents — ranchers, old-growth trail workers, and the kind of retirees who still know where the pre-development creeks run — about what they've seen, heard, and smelled in the brushy creek bottoms.
        
        ## The Hairy Man Road Origin
        
        The name "Hairy Man Road" doesn't come from nowhere. Local historical records from the late 1800s include accounts from settlers in the area describing a large, man-shaped creature covered in dark hair that was seen crossing creek bottoms at dusk. Early German and Czech settlers in Williamson County — people not prone to superstition, people who farmed limestone-hard land with their hands — noted it in letters and diaries.
        
        The road was formally named sometime in the early 20th century, cementing the legend into county geography. You can drive it today; it's between Cedar Park and Round Rock, a winding two-lane road that gets dark fast once the streetlights end.
        
        ## Bill, 71, Former Williamson County Park Ranger (Retired 2008)
        
        "I worked those creek bottoms for thirty years. I saw things I don't talk about at dinner. Not because they were scary — I wasn't scared — but because people look at you different after.
        
        "The one I remember most was in the late 90s, before they built out all the subdivisions north of 79. I was doing an evening check near what's now Old Settlers Park, and I heard something in the brush that was moving way too heavy to be a deer. I shone my spotlight and I saw... I don't know what I saw. Big. Dark. Walking upright. And it smelled like the devil's armpit.
        
        "It was gone in about two seconds into the cedar. Left a track in the mud by the creek. I measured it. Fifteen and a half inches. I called it in as 'large animal, unidentified' and nobody followed up."
        
        ## Carol and Don, Longtime Georgetown Road Residents
        
        The couple has lived on a five-acre property backing to the Brushy Creek tributary since 1989. They've watched Round Rock grow from a small town to a major suburb around them, and they've watched something else too.
        
        "The dogs would go crazy," Carol says. "And not like with a coyote or a deer. Different. Lower. More serious. And this was three different dogs over thirty years — they all did the same thing."
        
        Don pulls out a phone and shows a blurry photo taken on a 2022 iPhone near their back fence line. It is, objectively, not a clear photograph. But the shape is large, and it is standing upright.
        
        "I know what it looks like," Don says. "I know it looks like a shadow. But I was standing right there. That thing was eight feet tall if it was an inch."
        
        ## The 2019 Ring Camera Incident
        
        In November 2019, a Ring doorbell camera on Chisholm Trail Road captured footage that spread rapidly through local Facebook groups before being removed. The homeowner, a software engineer at a Round Rock tech company who asked not to be named, described the footage:
        
        "It was 2:14 AM. The motion sensor triggered. There's something on my camera walking along the creek bank. Upright. Heavy step. It crosses the frame in about six seconds and goes into the brush on the other side.
        
        "I put it in the neighborhood Facebook group. Within about three hours it had 400 comments. Half the people said it was a bear. There are no bears in Williamson County. The other half said it was a person in a costume. At 2 AM. In November. Walking along a creek behind a subdivision."
        
        He submitted the footage to a Sasquatch research organization, which declined to authenticate or deny it, a non-answer he found deeply unsatisfying.
        
        ## Why Round Rock?
        
        The most credible explanation for persistent Sasquatch activity in the Round Rock area is ecological. The Brushy Creek watershed creates an unbroken natural corridor running from the undeveloped Balcones Canyonlands north of Cedar Park all the way into the Austin greenbelt system. It passes through Round Rock like a green thread through concrete.
        
        For a large, wide-ranging primate, this corridor offers water, cover, and — given the density of fast-food establishments along the route — a frankly impressive caloric opportunity.
        
        Round Rock isn't special because of its residents. Round Rock is special because of its creek bottoms. And the creek bottoms, as Bill the retired ranger put it, "were there before we were, and they'll be there after."
            
