      Hint: Body
      Value: |
        
        The **Brushy Creek Field Journal** is the official documentation tool of the Round Rock Sasquatch Society. Bound in soft brown leatherette, sewn (not glued, sewn — we paid extra), and printed on 80gsm cream paper that takes ink without bleeding through, even in the humidity of a creek bottom in July.
        
        Each journal includes ruled pages, a dedicated section for sketching footprints to scale, and — in a feature that has been requested for years and finally implemented in the 2025 edition — a perforated section in the back specifically for handwritten apologies to landowners whose property lines you may have inadvertently crossed during nighttime fieldwork. Tear out, sign, slide under door, drive away.
        
        ## Specifications
        
        - 200 lined pages (numbered)
        - 16 footprint-sketching pages (with scale ruler printed on edge)
        - 8 perforated apology pages (suggested wording printed in light gray)
        - Elastic closure band
        - Two ribbon bookmarks (cedar green and bone white, the Society colors)
        - Soft brown leatherette cover
        - 5.75" × 8.25"
        
        ## Suggested First Entry
        
        Date. Location. Weather. Time of arrival. What you brought. What you saw. What you think you saw. What it probably actually was. What it absolutely could not have been. Sign and date.
        
