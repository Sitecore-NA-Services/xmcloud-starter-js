      Hint: Body
      Value: |
        
        The **Trail Camera Multi-Pack** is a curated set of four (4) infrared trail cameras chosen for the specific challenges of the Brushy Creek environment: dense vegetation, suburban noise, and a deer population whose primary purpose appears to be triggering motion sensors at 3 AM.
        
        Each camera features black-flash infrared (no white flash — we cannot stress this enough), 16-megapixel still capture, 1080p video, and a strap that will be just slightly too short for the tree you actually want to mount it on. Twelve 32GB SD cards are included because you will absolutely fill them.
        
        ## What You Get
        
        - Four (4) trail cameras (mixed brands — we buy what's available)
        - Twelve (12) 32GB SD cards
        - Mounting straps (frequently too short)
        - Sixteen (16) AA batteries (not enough — you will need more)
        - One (1) printed PDF showing the optimal placement diagram for the Brushy Creek corridor (laminated)
        
        ## Realistic Expectations
        
        - 60% of your footage will be vegetation moving in the wind
        - 30% will be raccoons
        - 8% will be deer, dogs, or joggers
        - 1% will be unexplained
        - 1% will be the cameras getting stolen from the trail (it happens)
        
