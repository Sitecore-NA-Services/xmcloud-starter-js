      Hint: Body
      Value: |
        
        The **Cedar Stalker™** is constructed from over 1,200 individual jute strands, each hand-tied by Janet (semi-retired, Cedar Park) while watching her programs. The base layer is breathable mesh. The outer layer is roughly 40% real cedar, 60% "you'll never know."
        
        Walk slowly. Move with the wind. Avoid Old Settlers Park during T-ball season — children find this suit deeply upsetting and we are not in the business of generating Williamson County dispatch calls.
        
        ## Sizing
        
        - **Adult M/L:** Fits most. Hot.
        - **Adult XL:** Fits most. Hotter.
        
        This suit is hot. Plan accordingly.
        
        ## Care Instructions
        
        Spot clean only. Do not machine wash. Do not tumble dry. We don't actually know what happens if you do — Janet refuses to be in the same room as a clothes dryer running this product, which we take as advisory.
        
        ## Includes
        
        - The suit (one piece, hooded)
        - One (1) brown M&M, included as a lucky charm by Janet, do not eat
        - A laminated card you can hold up to confused law enforcement that says "I AM RESEARCHING WILDLIFE"
        
