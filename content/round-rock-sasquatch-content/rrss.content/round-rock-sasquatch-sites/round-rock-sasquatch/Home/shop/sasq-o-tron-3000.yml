    - ID: "e5256078-194c-43f2-bc87-f446896c65ca"
      Hint: Body
      Value: |
        
        The **Sasq-O-Tron 3000™** is the result of seventeen weekends of suburban backyard chemistry and one (1) very confused organic chemist who agreed to consult after his second beer. Each bottle contains a proprietary blend of cedar oil, ammonia, deer urine concentrate, and what we are legally required to describe as "additional ingredients."
        
        Apply a single mist to the upwind side of your observation site. Field reports describe results ranging from "increased rustling in the cedar" to "a coyote came up and stared at me for 90 seconds." Both qualify as activity. Both go in the journal.
        
        ## What's in the Box
        
        - One (1) 6 oz amber atomizer bottle
        - One (1) replacement nozzle (clogs are common)
        - One (1) folded card explaining that this is not regulated by the FDA, the EPA, or any agency that would care
        - Disposable gloves (please use them)
        
        ## A Note on Indoor Use
        
        Do not use this product indoors. Do not use this product in your car. We have learned these things the hard way.
        
