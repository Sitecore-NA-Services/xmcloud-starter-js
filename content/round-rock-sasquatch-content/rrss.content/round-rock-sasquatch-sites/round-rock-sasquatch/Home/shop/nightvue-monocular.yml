    - ID: "e5256078-194c-43f2-bc87-f446896c65ca"
      Hint: Body
      Value: |
        
        The **NightVue™ Gen 1.5** is a refurbished surplus night vision unit lovingly inspected by our procurement guy Doug, who used to be in the military adjacent (specifically, he worked at a Sears that sold tools to people who were in the military). Each unit is tested, cleaned, and shipped in a padded case with one (1) lens cap that does not stay on.
        
        Resolution is acceptable. Battery life is acceptable. The image is green. Stars look great. Trees look great. A raccoon at 30 yards is unmistakable. A 9-foot bipedal cryptid at 80 yards looks, in our experience, like a vague upright shape and you will not know what it was. This is the nature of the equipment.
        
        ## Specifications
        
        - 4x magnification
        - IR illuminator (built-in, runs on 2 AA batteries not included)
        - Effective range: 100 yards (claimed), 60 yards (honest)
        - Weight: 0.8 lbs
        - Refurbished. Sold as-is. Sometimes the on/off switch is funky.
        
        ## Doug's Personal Recommendation
        
        "For the money? You're not gonna do better. Just don't drop it. And don't look at headlights through it. Trust me."
        
