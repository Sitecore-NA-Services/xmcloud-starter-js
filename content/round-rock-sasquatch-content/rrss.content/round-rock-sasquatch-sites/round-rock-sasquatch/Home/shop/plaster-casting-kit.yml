      Hint: Body
      Value: |
        
        Stop using plaster of Paris like an amateur. The **Hairy Man Road Casting Kit (Deluxe)** uses dental stone — the same compound used by professional forensic units, podiatrists, and at least one art teacher we know — for crisp, expansion-free impressions you can hand off to a skeptical local TV news producer with confidence.
        
        Each kit ships with detailed instructions, but the short version is: spray hair spray to stabilize, mix two parts dental stone to one part water, pour from the heel end, wait 30 minutes, lift, and try not to text your spouse a photo before the dental stone has set because they will ask follow-up questions you are not prepared to answer.
        
        ## Kit Contents
        
        - 5 lbs dental stone powder
        - Cardboard casting frame (assembled)
        - Mixing bag and spatula
        - One (1) can aerosol hair spray (any brand, we just buy whatever is cheap at HEB)
        - 10 numbered authentication tags ("RR-CAST-0001" through "RR-CAST-0010")
        - Field log card
        
        ## What This Kit Will Not Do
        
        This kit will not authenticate your cast. We just sell you the materials. The authentication tag has a number on it. That number does not mean anything. We are being upfront about this.
        
