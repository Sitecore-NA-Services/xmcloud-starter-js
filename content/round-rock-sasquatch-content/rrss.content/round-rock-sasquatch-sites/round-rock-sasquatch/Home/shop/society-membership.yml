      Hint: Body
      Value: |
        
        The **Round Rock Sasquatch Society Lifetime Membership** is the highest tier of involvement available to the public. Membership grants you voting rights at the (irregularly scheduled, sometimes cancelled) Annual General Meeting, access to the members-only section of the Society newsletter, and the satisfaction of knowing that your $99.99 has been routed primarily into trail camera batteries.
        
        Each card is individually numbered, hot-stamped with the Society seal, and laminated to a thickness that exceeds most state-issued ID. The card will outlive you. We are not exaggerating.
        
        ## Lifetime Member Benefits
        
        - A numbered Lifetime Member card (your number is yours forever)
        - The Society newsletter (annual, sometimes printed, mailed when funds permit)
        - Voting rights at the AGM (location: Bill's house; quorum: rarely achieved)
        - A 10% discount on most Society merchandise (this product excluded)
        - The right to refer to yourself as "a Society member" in public, which you may use freely
        
        ## A Note on the Word "Lifetime"
        
        The word "lifetime" refers to your lifetime, not the Society's. The Society does not commit to existing for any specific duration. Refunds are not available in the event of dissolution, which we do not anticipate but cannot rule out.
        
