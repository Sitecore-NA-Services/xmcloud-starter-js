      Hint: Body
      Value: |
        
        The **Williamson County Wood-Knock Branch** is a hand-selected length of seasoned cedar, harvested from authorized clearings along the Brushy Creek watershed. Each branch is approximately 22 inches long, has been weighed, and has been struck against a tree by a Society member to verify acoustic properties (good).
        
        Yes — you could find one of these yourself. Yes — it is, as the product description plainly states, a stick. But this is not just any stick. This is a stick that comes with a small numbered tag, a certificate of provenance, and the spiritual cosign of an organization that has put more thought into it than you have.
        
        ## Why Buy a Stick
        
        Look. We're a non-profit. We have to fund the trail cameras somehow. You're going to use a stick anyway. You can either go pick one up off the ground, or you can support the Society and get one with a tag on it. We respect either choice.
        
        ## Specifications
        
        - Length: ~22 inches (varies)
        - Wood: Eastern Red Cedar (probably)
        - Weight: ~0.7 lbs (varies)
        - One (1) numbered tag attached with twine
        - Free shipping is not offered on this product because frankly we'd lose money on it
        
