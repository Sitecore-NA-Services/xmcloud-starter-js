    - ID: "8be8f50d-730f-484c-80be-3dbdb0cb6e58"
      Hint: ArticleContent
      Value: Microsoft Paint (antes Paintbrush, luego Paint) es un editor de gráficos rasterizados sencillo que se ha incluido en todas las versiones de Microsoft Windows. El programa abre y guarda archivos en los formatos Windows bitmap (BMP), JPEG, GIF, PNG y TIFF de una sola página. Puede funcionar en modo a color o en blanco y negro de dos tonos, pero no dispone de un modo de escala de grises. Por su sencillez y amplia disponibilidad, se convirtió rápidamente en una de las aplicaciones más usadas en las primeras versiones de Windows, introduciendo a muchos en el dibujo básico por computadora. En los últimos años se ha actualizado con funciones modernas como capas y Cocreator, conservando su legado en la era digital.
