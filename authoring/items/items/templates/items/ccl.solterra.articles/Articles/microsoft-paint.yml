    - ID: "8be8f50d-730f-484c-80be-3dbdb0cb6e58"
      Hint: ArticleContent
      Value: "Microsoft Paint (formerly Paintbrush, then Paint) is a simple raster graphics editor that has been included with all versions of Microsoft Windows. The program opens and saves files in Windows bitmap (BMP), JPEG, GIF, PNG, and single-page TIFF formats. The program can be in color mode or two-color black-and-white, but there is no grayscale mode. For its simplicity and wide availability, it quickly became one of the most used applications in the early versions of Windows, introducing many to basic computer drawing. In recent years, it has been updated with modern features like layers and Cocreator, continuing its legacy in the digital age."
