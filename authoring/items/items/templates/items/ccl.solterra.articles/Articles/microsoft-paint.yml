    - ID: "8be8f50d-730f-484c-80be-3dbdb0cb6e58"
      Hint: ArticleContent
      Value: Microsoft Paint（旧称 Paintbrush、後に Paint）は、すべてのバージョンの Microsoft Windows に付属しているシンプルなラスターグラフィックエディタです。プログラムは Windows ビットマップ（BMP）、JPEG、GIF、PNG、および単一ページの TIFF 形式のファイルを開いたり保存したりできます。カラーモードまたは二色の白黒モードで動作しますが、グレースケールモードはありません。その簡潔さと広い普及により、初期の Windows では非常に多く利用され、基本的なコンピュータ描画を多くの人に紹介しました。近年ではレイヤーや Cocreator のようなモダンな機能が追加され、デジタル時代におけるその遺産を受け継いでいます。
