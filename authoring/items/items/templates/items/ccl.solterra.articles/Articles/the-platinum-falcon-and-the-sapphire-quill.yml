    - ID: "2485de13-6c39-468c-9c26-fe08c27088f4"
      Hint: pageSummary
      Value: |
        Space pirate Han Duo and his murrik co-conspirator Fluffy take a “quiet” job: steal the Sapphire Quill from the Kaviri vaults in Kerez-Sha, a floating city that trades in history and law.
        
        After Fluffy distracts the memory-winds guarding the Vault of Looms, Han secures the Quill—triggering alarms and a pursuit led by Marshal Vree. The Platinum Falcon escapes through a comet-sluice using song, tricks, and misdirection.
        
        In the Outer Rings, Old Maru hollows the Quill and releases a stolen apprentice’s memory. Han refuses coin but accepts a story, then sets course for more work—small, messy justice among the stars.
