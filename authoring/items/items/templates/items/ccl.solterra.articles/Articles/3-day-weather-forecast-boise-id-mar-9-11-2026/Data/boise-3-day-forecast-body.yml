        ## 3-Day Weather Forecast — Boise, ID (Mar 9–11, 2026)
        
        Assumption: No specific local-event listings were provided in the research; this forecast addresses general public activities and common outdoor events. If you have a specific event, check the timing below against local schedules.
        
        ---
        
        ### Overview
        Mild early-spring conditions are expected across Boise over the next three days with daytime highs in the upper 50s to low 60s F, cool nights in the mid-to-upper 30s F, light chance of evening showers tonight, mostly dry and mild Tuesday, and a slightly increased chance of afternoon showers Wednesday with breezy west winds.
        
        ---
        
        ### Today — Monday, Mar 9, 2026 (Today)
        - Conditions: Partly sunny through the afternoon, increasing high clouds late afternoon and evening.
        - Temperatures: High 58°F, Low 36°F overnight.
        - Precipitation: Small chance of light rain late evening (20% after 9 PM), otherwise dry during daytime.
        - Wind: South winds 10–15 mph, gusts to 25 mph in the afternoon/evening.
        - Impact: Pleasant daytime for outdoor activities; light rain late evening may make surfaces briefly damp.
        
        ---
        
        ### Tuesday — Mar 10, 2026
        - Conditions: Mostly sunny and mild.
        - Temperatures: High 62°F, Low 38°F.
        - Precipitation: Little to no precipitation expected (near 0–5%).
        - Wind: South to southwest 8–12 mph, gusts to 20 mph.
        - Impact: Good day for outdoor work, recreation, and commuting with comfortable highs and minimal rain risk.
        
        ---
        
        ### Wednesday — Mar 11, 2026
        - Conditions: Morning sunshine giving way to increasing clouds; scattered afternoon/evening showers possible.
        - Temperatures: High 60°F, Low 39°F.
        - Precipitation: Chance of scattered showers 30%–40% in the afternoon and evening.
        - Wind: West winds 10–18 mph, gusts up to 30 mph possible during showers.
        - Impact: Plan for breezy conditions and spotty wet weather in the afternoon/evening. Showers could cause brief slippery spots on roadways.
        
        ---
        
        ### Local Events and Weather Impact
        - No specific local events were listed in the provided research. Assuming typical local outdoor activities (markets, park events, late-afternoon recreational events):
          - Monday evening outdoor events may see a light risk of brief rain after 9 PM; consider quick-cover options or moving activities indoors.
          - Tuesday is favorable for outdoor events — mild, mostly dry.
          - Wednesday afternoon/evening events should plan for possible scattered showers and breezy conditions; secure tents and lightweight structures against gusts.
        
        ---
        
        ### Travel Advisory
        - Road Conditions: Dry for most travel Monday and Tuesday daytime. Watch for brief damp/slick patches late Monday night and again Wednesday afternoon/evening where showers occur.
        - Driving Tips: Reduce speed in wet patches; allow extra stopping distance during showers and gusty winds. High-profile vehicles should be cautious of gusts up to 30 mph Wednesday.
        - Air Travel: No widespread impacts expected; brief flight delays possible if localized showers occur Wednesday afternoon.
        - Recreation & Commuting: Dress in layers for cool mornings and mild afternoons. Bring a light rain jacket or compact umbrella for late Monday evening and Wednesday afternoon/evening.
        
