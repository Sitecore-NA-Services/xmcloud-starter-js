      Value: "<p>The Prado bowl has been a European proving ground since the eighties, sat on the Mediterranean coast with the sea on one side and the city behind it. The deep end has humbled visiting professionals for forty years.</p><p>The street section is considerably friendlier, which is where most people start before working up the nerve.</p><h3>Before you drop in</h3><ul><li>The deep end is deeper than it photographs</li><li>Shade is limited - summer afternoons are brutal</li><li>Open 8am to 9pm</li></ul>"
