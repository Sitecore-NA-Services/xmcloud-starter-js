      Value: "<p>Open since 1977 and still family-run, which makes it the oldest continuously operating skatepark on earth. Snake run, bowls and a large street course spread across shaded Florida acreage.</p><p>Several generations of the same families have learned to skate here. It shows in how the place is looked after.</p><h3>Before you drop in</h3><ul><li>Something rideable for every level</li><li>Shaded, which matters in a Florida summer</li><li>Open 10am to 10pm</li></ul>"
