    - ID: "05918db7-821b-4487-98cc-b7aec81de5dd"
      Hint: Content
      Value: "<p>Poured by skaters in 1990 under the east end of the Burnside Bridge, this is the DIY park every other DIY park is measured against. Nobody asked permission. The first loads of concrete went down at night, and the city eventually decided the result was better than what had been there before.</p><p>The transitions are steep and unforgiving, the pool corner is genuinely deep, and the whole thing sits under a bridge deck that keeps it dry when Portland does what Portland does. There are no lights, so the session ends when the light does.</p><h3>Before you drop in</h3><ul><li>Not a beginner park - watch a few runs before you commit</li><li>Covered, so it stays rideable through the rain</li><li>Dawn to dusk only</li></ul>"
